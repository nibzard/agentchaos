[project]
name = "gauntlet-compiler"
version = "0.1.0"
description = "Deterministic experiment manifest compiler for AgentChaos"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gauntlet_compiler*"]
