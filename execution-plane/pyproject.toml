[project]
name = "acx-runner"
version = "0.1.0"
description = "Local fixture runner for AgentChaos experiments"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acx_runner*", "acx_scenarios*"]
