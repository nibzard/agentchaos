<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — run timeline</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; text-transform: capitalize; }
    .lane { border-left: 4px solid #ccc; padding-left: .75rem;
            margin-bottom: 1.25rem; }
    .lane[data-lane="broker"] { border-left-color: #b00020; }
    .lane[data-lane="monitor"] { border-left-color: #6a1b9a; }
    .ordering, .empty { color: #777; }
    .trust { display: inline-block; border: 1px solid #999;
             border-radius: 3px; padding: 0 .3rem; font-size: .8rem; }
    .event.worker_claim .trust { border-color: #e65100;
                                 color: #e65100; }
    .event.collector_fact .trust { border-color: #2e7d32;
                                   color: #2e7d32; }
    .event.monitor_interpretation .trust { border-color: #6a1b9a;
                                           color: #6a1b9a; }
    .missing { color: #b00020; font-weight: 600; }
    code { background: #f4f4f4; padding: 0 .2rem; border-radius: 3px;
           word-break: break-all; }
    ol.events { padding-left: 1.25rem; }
    ol.events li { margin-bottom: .35rem; }
  </style>
</head>
<body>
