<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — comparison and assurance</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; }
    table { border-collapse: collapse; margin-bottom: 1rem; }
    th, td { border: 1px solid #ccc; padding: .35rem .6rem;
             text-align: left; font-size: .9rem; }
    thead th { background: #f4f4f4; }
    tr.notes td { border-top: none; }
    .refusal, .gaps { color: #b00020; }
    .unknown, .clusters { color: #777; }
    .verdict.improvement { color: #2e7d32; }
    .verdict.regression { color: #b00020; font-weight: 600; }
    .verdict.uncertain, .verdict.unknown-direction { color: #777; }
    .claim { border: 1px solid #ccc; padding: 1rem;
             margin-bottom: 1rem; max-width: 46rem; }
    .claim.STALE { border-color: #b00020; }
    .claim.VIOLATED { border-color: #b00020; border-width: 2px; }
    .status { font-weight: 600; }
    .status.SUPPORTED_WITHIN_SCOPE { color: #2e7d32; }
    .status.VIOLATED, .status.STALE { color: #b00020; }
    .status.TARGET_NOT_DEMONSTRATED,
    .status.INSUFFICIENT_EVIDENCE { color: #e65100; }
    dl.fingerprints { display: grid;
                      grid-template-columns: auto 1fr; gap: .15rem .5rem; }
    dl.fingerprints dt { color: #555; }
    code { background: #f4f4f4; padding: 0 .2rem; border-radius: 3px; }
    .empty { color: #777; }
  </style>
</head>
<body>
