<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — workload overview</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: .3rem; }
    .environment[data-environment="production"] h2 { color: #8a1c1c; }
    .workloads { list-style: none; padding: 0; display: grid; gap: 1rem; }
    .workload { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; }
    .gaps { border-left: 4px solid #b00020; padding-left: .75rem; }
    .gaps.none { border-left-color: #2e7d32; }
    .gap.high .severity { font-weight: 700; color: #b00020; }
    .gap.medium .severity { font-weight: 700; color: #b06000; }
    .gap.low .severity { font-weight: 700; color: #555; }
    .freshness.stale, .freshness.unknown { color: #b06000; }
    .empty { color: #777; font-style: italic; }
    code { background: #f4f4f4; padding: 0 .2rem; border-radius: 3px; }
  </style>
</head>
<body>
