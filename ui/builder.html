<!doctype html>
<html lang="en">
<head>

  <title>Gauntlet — experiment builder</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }

    .blockers.none { border-left-color: #2e7d32; }
    .no-override { color: #555; }

    code { background: #f4f4f4; padding: 0 .2rem; border-radius: 3px; }
  </style>
</head>
<body>

</html>
