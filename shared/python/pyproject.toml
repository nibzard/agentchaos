[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acx-schemas"
version = "0.1.0"
description = "Strict contract schemas and validator for AgentChaos resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.10,<5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["acx_schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
